<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0b1020" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>BMS Blank</title>
<style>
:root{--bg:#0b1020;--panel:rgba(12,18,35,.72);--text:#f7f8fb;--muted:#b9c2d6;--accent:#4da3ff;--cols:4;--tile:86px;--radius:24px}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;background:var(--bg);color:var(--text)}body{min-height:100dvh;background-size:cover;background-position:center;background-attachment:fixed;overflow-x:hidden}body::before{content:"";position:fixed;inset:0;background:linear-gradient(180deg,rgba(2,6,16,.34),rgba(2,6,16,.72));pointer-events:none;z-index:-1}button,input,select{font:inherit}button{cursor:pointer}.shell{min-height:100dvh;padding:calc(env(safe-area-inset-top) + 18px) 14px calc(env(safe-area-inset-bottom) + 22px)}.topbar{display:flex;align-items:center;gap:10px;max-width:900px;margin:auto}.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1}.logo{width:46px;height:46px;border-radius:15px;background:linear-gradient(145deg,#2a5fa9,#11192d);display:grid;place-items:center;font-weight:900;box-shadow:0 10px 30px #0008;border:1px solid #ffffff1f}.brandtext h1{font-size:22px;margin:0}.brandtext p{font-size:12px;color:var(--muted);margin:2px 0 0}.iconbtn{width:46px;height:46px;border:1px solid #ffffff1c;background:var(--panel);color:var(--text);border-radius:15px;display:grid;place-items:center;font-size:21px}.toolbar{max-width:900px;margin:16px auto 0;display:flex;gap:9px;align-items:center}.search{flex:1;display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid #ffffff1a;border-radius:18px;padding:0 14px}.search input{height:48px;flex:1;background:transparent;border:none;outline:none;color:var(--text);min-width:0}.editbtn{height:48px;padding:0 16px;border-radius:18px;border:1px solid #ffffff1a;background:var(--panel);color:var(--text)}.editbtn.active{background:#17345f;border-color:#4da3ff66}.grid{max-width:900px;margin:20px auto 0;display:grid;grid-template-columns:repeat(var(--cols),minmax(0,1fr));gap:15px 10px;align-items:start}.app{position:relative;min-width:0;text-align:center;user-select:none;touch-action:none}.tile{width:min(100%,var(--tile));aspect-ratio:1;border-radius:var(--radius);margin:auto;background:linear-gradient(145deg,rgba(255,255,255,.14),rgba(255,255,255,.06));border:1px solid #ffffff1f;box-shadow:0 9px 25px #0008;display:grid;place-items:center;overflow:hidden}.app.dragging{opacity:.45}.app.drag-over .tile{outline:2px solid var(--accent);outline-offset:3px}.app img{width:100%;height:100%;object-fit:cover}.initial{font-weight:800;font-size:30px;color:white}.name{font-size:13px;line-height:1.3;margin:7px auto 0;max-width:105px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.edit-badge{display:none;position:absolute;top:-7px;left:calc(50% - min(50%, var(--tile)/2) - 4px);width:28px;height:28px;border:0;border-radius:50%;background:#f4f7ff;color:#1b2740;font-size:16px;z-index:3}.editmode .edit-badge{display:grid;place-items:center}.empty{max-width:560px;margin:16vh auto 0;text-align:center;padding:28px;border-radius:28px;background:var(--panel);border:1px solid #ffffff1a}.empty .big{font-size:46px}.empty h2{margin:8px 0}.empty p{color:var(--muted);line-height:1.8}.primary{border:0;border-radius:16px;padding:13px 19px;background:linear-gradient(135deg,#2d74db,#53a8ff);color:#fff;font-weight:700}dialog{width:min(94vw,520px);border:1px solid #ffffff24;border-radius:26px;padding:0;background:#11182a;color:var(--text)}dialog::backdrop{background:#000a}.modal{padding:20px}.modal h2{margin:0 0 16px}.field{margin:12px 0}.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:7px}.field input,.field select{width:100%;height:47px;border-radius:14px;border:1px solid #ffffff20;background:#0c1220;color:#fff;padding:0 12px;outline:none}.preview{width:82px;height:82px;border-radius:22px;margin:10px auto;background:#172035;display:grid;place-items:center;overflow:hidden;border:1px solid #ffffff1f}.preview img{width:100%;height:100%;object-fit:cover}.smallnote{font-size:12px;color:var(--muted);line-height:1.6}.row{display:flex;gap:10px}.row>*{flex:1}.actions{display:flex;gap:10px;margin-top:18px}.actions button{height:46px;border-radius:14px;border:1px solid #ffffff1d;padding:0 15px}.save{background:#2b79dd;color:white;flex:1}.cancel{background:#1b2232;color:#fff}.danger{background:#3b1720;color:#ffb2bc}.hidden{display:none!important}.settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.settings-grid button{min-height:76px;border-radius:18px;border:1px solid #ffffff1c;background:#171f30;color:#fff;padding:12px;text-align:right}.settings-grid button small{display:block;color:var(--muted);margin-top:3px}.rangeval{color:#8cc6ff;font-weight:700}.bg-thumb{width:100%;height:110px;border-radius:18px;background:linear-gradient(135deg,#111a30,#24375b);background-size:cover;background-position:center;border:1px solid #ffffff20;margin-bottom:10px}.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(30px);opacity:0;background:#111827e8;border:1px solid #ffffff24;color:#fff;padding:11px 16px;border-radius:14px;z-index:20;transition:.2s}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}@media(max-width:430px){:root{--tile:76px}.grid{gap:15px 6px}.name{font-size:12px}.brandtext h1{font-size:20px}.settings-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<main class="shell"><header class="topbar"><div class="brand"><div class="logo">BMS</div><div class="brandtext"><h1>BMS Blank</h1><p>تطبيقاتك فقط، بطريقتك</p></div></div><button id="addTop" class="iconbtn">＋</button><button id="settingsBtn" class="iconbtn">⚙</button></header><section class="toolbar"><div class="search">⌕ <input id="search" type="search" placeholder="ابحث في تطبيقاتك..." /></div><button id="editBtn" class="editbtn">ترتيب</button></section><section id="empty" class="empty hidden"><div class="big">＋</div><h2>ابدأ من الصفر</h2><p>لا توجد أي تطبيقات جاهزة. أضف تطبيقاتك أنت فقط، ثم رتّبها بالسحب كما تريد.</p><button id="addEmpty" class="primary">إضافة أول تطبيق</button></section><section id="grid" class="grid"></section></main>
<dialog id="appDialog"><form class="modal" method="dialog" id="appForm"><h2 id="appDialogTitle">إضافة تطبيق</h2><div class="preview" id="iconPreview"><span class="initial">A</span></div><div class="field"><label>اسم التطبيق</label><input id="appName" required maxlength="40" /></div><div class="field"><label>رابط التطبيق</label><input id="appUrl" required inputmode="url" placeholder="https://..." /></div><div class="field"><label>أيقونة التطبيق (اختياري)</label><input id="iconFile" type="file" accept="image/*" /></div><div class="field"><label>لون البطاقة عند عدم وجود أيقونة</label><input id="appColor" type="color" value="#2d74db" /></div><p class="smallnote">تُحفظ الأيقونة محليًا في الجهاز.</p><div class="actions"><button type="button" id="deleteApp" class="danger hidden">حذف</button><button type="button" id="cancelApp" class="cancel">إلغاء</button><button type="submit" class="save">حفظ</button></div></form></dialog>
<dialog id="settingsDialog"><div class="modal"><h2>إعدادات BMS</h2><div id="bgThumb" class="bg-thumb"></div><div class="field"><label>تغيير الخلفية من الجهاز</label><input id="bgFile" type="file" accept="image/*" /></div><div class="row"><div class="field"><label>عدد الأعمدة</label><select id="columns"><option value="3">3</option><option value="4">4</option><option value="5">5</option></select></div><div class="field"><label>حجم الأيقونات <span id="sizeValue" class="rangeval"></span></label><input id="tileSize" type="range" min="62" max="105" step="1" /></div></div><div class="settings-grid"><button id="backupBtn">⬇ نسخ احتياطي<small>يحفظ التطبيقات والترتيب والإعدادات</small></button><button id="restoreBtn">⬆ استعادة نسخة<small>استعادة ملف JSON سابق</small></button><button id="resetBgBtn">▧ إزالة الخلفية<small>العودة للخلفية الداكنة</small></button><button id="clearBtn">⌫ حذف كل التطبيقات<small>إفراغ BMS والبدء من جديد</small></button></div><input id="restoreFile" class="hidden" type="file" accept="application/json,.json" /><div class="actions"><button id="closeSettings" class="save">تم</button></div></div></dialog><div id="toast" class="toast"></div>
<script>
(()=>{const KEY='bms.blank.v1',defaultState={apps:[],columns:4,tileSize:86,background:''};let state=load(),editMode=false,editingId=null,pendingIcon='',dragId=null;const $=s=>document.querySelector(s),grid=$('#grid'),empty=$('#empty'),search=$('#search'),editBtn=$('#editBtn'),appDialog=$('#appDialog'),appForm=$('#appForm'),appName=$('#appName'),appUrl=$('#appUrl'),iconFile=$('#iconFile'),appColor=$('#appColor'),iconPreview=$('#iconPreview'),deleteApp=$('#deleteApp'),settingsDialog=$('#settingsDialog'),columns=$('#columns'),tileSize=$('#tileSize'),sizeValue=$('#sizeValue'),bgThumb=$('#bgThumb');function load(){try{return {...defaultState,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch(e){return {...defaultState}}}function save(){localStorage.setItem(KEY,JSON.stringify(state));applySettings()}function uid(){return'a'+Date.now().toString(36)+Math.random().toString(36).slice(2,7)}function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('show');clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('show'),1800)}function safeUrl(u){u=u.trim();if(!/^https?:\/\//i.test(u))u='https://'+u;return u}function applySettings(){document.documentElement.style.setProperty('--cols',state.columns);document.documentElement.style.setProperty('--tile',state.tileSize+'px');document.body.style.backgroundImage=state.background?`url("${state.background}")`:'';columns.value=state.columns;tileSize.value=state.tileSize;sizeValue.textContent=state.tileSize+'px';bgThumb.style.backgroundImage=state.background?`url("${state.background}")`:''}function render(){applySettings();const q=search.value.trim().toLowerCase(),apps=state.apps.filter(a=>a.name.toLowerCase().includes(q));grid.innerHTML='';grid.classList.toggle('editmode',editMode);empty.classList.toggle('hidden',state.apps.length!==0||q.length>0);grid.classList.toggle('hidden',state.apps.length===0&&!q);for(const a of apps){const el=document.createElement('div');el.className='app';el.dataset.id=a.id;const tile=document.createElement('div');tile.className='tile';if(a.icon){const img=new Image();img.src=a.icon;tile.appendChild(img)}else{const ini=document.createElement('span');ini.className='initial';ini.textContent=(a.name.trim()[0]||'A').toUpperCase();tile.style.background=`linear-gradient(145deg,${a.color||'#2d74db'},#111a2b)`;tile.appendChild(ini)}const name=document.createElement('div');name.className='name';name.textContent=a.name;const badge=document.createElement('button');badge.type='button';badge.className='edit-badge';badge.textContent='✎';badge.onclick=e=>{e.stopPropagation();openEdit(a.id)};el.append(tile,name,badge);el.onclick=()=>{if(!editMode)location.href=a.url};el.addEventListener('pointerdown',pointerDown);el.addEventListener('pointermove',pointerMove);el.addEventListener('pointerup',pointerUp);el.addEventListener('pointercancel',pointerUp);grid.appendChild(el)}}let startX=0,startY=0,draggingEl=null,longTimer=null;function pointerDown(e){if(!editMode)return;const el=e.currentTarget;startX=e.clientX;startY=e.clientY;dragId=el.dataset.id;longTimer=setTimeout(()=>{draggingEl=el;el.classList.add('dragging');try{el.setPointerCapture(e.pointerId)}catch(_){}},120)}function pointerMove(e){if(!editMode)return;if(!draggingEl&&Math.hypot(e.clientX-startX,e.clientY-startY)>9){clearTimeout(longTimer);draggingEl=e.currentTarget;draggingEl.classList.add('dragging')}if(!draggingEl)return;const under=document.elementFromPoint(e.clientX,e.clientY)?.closest('.app');document.querySelectorAll('.drag-over').forEach(x=>x.classList.remove('drag-over'));if(under&&under!==draggingEl)under.classList.add('drag-over')}function pointerUp(e){clearTimeout(longTimer);if(!editMode)return;if(draggingEl){const target=document.elementFromPoint(e.clientX,e.clientY)?.closest('.app');if(target&&target!==draggingEl)moveApp(dragId,target.dataset.id);draggingEl.classList.remove('dragging');draggingEl=null;document.querySelectorAll('.drag-over').forEach(x=>x.classList.remove('drag-over'))}dragId=null}function moveApp(id,targetId){const from=state.apps.findIndex(a=>a.id===id),to=state.apps.findIndex(a=>a.id===targetId);if(from<0||to<0)return;const[a]=state.apps.splice(from,1);state.apps.splice(to,0,a);save();render()}function openAdd(){editingId=null;pendingIcon='';appForm.reset();appColor.value='#2d74db';$('#appDialogTitle').textContent='إضافة تطبيق';deleteApp.classList.add('hidden');updatePreview();appDialog.showModal()}function openEdit(id){const a=state.apps.find(x=>x.id===id);if(!a)return;editingId=id;pendingIcon=a.icon||'';appName.value=a.name;appUrl.value=a.url;appColor.value=a.color||'#2d74db';$('#appDialogTitle').textContent='تعديل التطبيق';deleteApp.classList.remove('hidden');updatePreview();appDialog.showModal()}function updatePreview(){iconPreview.innerHTML='';if(pendingIcon){const img=new Image();img.src=pendingIcon;iconPreview.appendChild(img)}else{const s=document.createElement('span');s.className='initial';s.textContent=(appName.value.trim()[0]||'A').toUpperCase();iconPreview.style.background=`linear-gradient(145deg,${appColor.value},#111a2b)`;iconPreview.appendChild(s)}}appName.addEventListener('input',updatePreview);appColor.addEventListener('input',updatePreview);iconFile.addEventListener('change',async()=>{const f=iconFile.files[0];if(!f)return;pendingIcon=await imageToData(f,256,256,.86,true);updatePreview()});appForm.addEventListener('submit',e=>{e.preventDefault();const name=appName.value.trim(),url=safeUrl(appUrl.value);if(!name||!url)return;if(editingId){const a=state.apps.find(x=>x.id===editingId);Object.assign(a,{name,url,icon:pendingIcon,color:appColor.value})}else state.apps.push({id:uid(),name,url,icon:pendingIcon,color:appColor.value});save();render();appDialog.close();toast('تم الحفظ')});deleteApp.onclick=()=>{if(editingId&&confirm('حذف هذا التطبيق؟')){state.apps=state.apps.filter(a=>a.id!==editingId);save();render();appDialog.close()}};$('#cancelApp').onclick=()=>appDialog.close();$('#addTop').onclick=openAdd;$('#addEmpty').onclick=openAdd;editBtn.onclick=()=>{editMode=!editMode;editBtn.classList.toggle('active',editMode);editBtn.textContent=editMode?'تم':'ترتيب';render()};search.addEventListener('input',render);$('#settingsBtn').onclick=()=>{applySettings();settingsDialog.showModal()};$('#closeSettings').onclick=()=>settingsDialog.close();columns.onchange=()=>{state.columns=+columns.value;save();render()};tileSize.oninput=()=>{state.tileSize=+tileSize.value;sizeValue.textContent=state.tileSize+'px';document.documentElement.style.setProperty('--tile',state.tileSize+'px')};tileSize.onchange=()=>{save();render()};$('#bgFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;state.background=await imageToData(f,1600,2400,.78,false);save();render();toast('تم تغيير الخلفية')};$('#resetBgBtn').onclick=()=>{state.background='';save();render()};$('#backupBtn').onclick=()=>{const name='BMS_Backup_'+new Date().toISOString().slice(0,10)+'.json',json=JSON.stringify(state,null,2);if(window.Android&&typeof Android.saveText==='function')Android.saveText(name,json)};$('#restoreBtn').onclick=()=>$('#restoreFile').click();$('#restoreFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const data=JSON.parse(await f.text());if(!Array.isArray(data.apps))throw 0;state={...defaultState,...data};save();render();toast('تمت الاستعادة')}catch(_){alert('ملف النسخة الاحتياطية غير صالح')}};$('#clearBtn').onclick=()=>{if(confirm('سيتم حذف جميع التطبيقات من BMS. هل أنت متأكد؟')){state.apps=[];save();render()}};async function imageToData(file,maxW,maxH,quality,square){return new Promise((resolve,reject)=>{const img=new Image(),r=new FileReader();r.onload=()=>img.src=r.result;r.onerror=reject;img.onload=()=>{let sw=img.width,sh=img.height,sx=0,sy=0;if(square){const s=Math.min(sw,sh);sx=(sw-s)/2;sy=(sh-s)/2;sw=sh=s}const ratio=Math.min(maxW/sw,maxH/sh,1),cw=Math.max(1,Math.round(sw*ratio)),ch=Math.max(1,Math.round(sh*ratio)),c=document.createElement('canvas');c.width=cw;c.height=ch;c.getContext('2d').drawImage(img,sx,sy,sw,sh,0,0,cw,ch);resolve(c.toDataURL('image/jpeg',quality))};r.readAsDataURL(file)})}applySettings();render()})();
</script></body></html>
